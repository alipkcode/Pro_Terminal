name: Release

# Builds the Windows installer and opens a draft GitHub release for review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json), e.g. 1.3.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check version
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne '${{ inputs.version }}') { throw "package.json is $pkg, not ${{ inputs.version }}" }

      - run: npm ci
      # Electron downloads its binaries on first use, not on install; electron-builder needs them.
      - run: node -e "require('electron')"
      - run: npm run typecheck
      - run: npm run dist -- --publish never

      - name: Write release notes
        run: |
          $v = '${{ inputs.version }}'
          $exe = "dist/Pro-Terminal-Setup-$v.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?s)## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=\n## \[|\n\[)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          @"
          $notes

          ### Download
          **[Pro-Terminal-Setup-$v.exe](https://github.com/${{ github.repository }}/releases/download/v$v/Pro-Terminal-Setup-$v.exe)**. Windows 10 1809+ / 11, x64. Installs per user, with no admin rights needed.

          SHA-256: ``$hash``
          "@ | Set-Content notes.md -Encoding utf8

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ inputs.version }}'
          gh release create "v$v" "dist/Pro-Terminal-Setup-$v.exe" `
            --target "${{ github.sha }}" --title "Pro Terminal $v" --notes-file notes.md --draft
