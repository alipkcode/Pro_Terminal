<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Pro Terminal: a modern workspace for the real CMD and PowerShell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141833"/>
      <stop offset="0.55" stop-color="#0c0f1d"/>
      <stop offset="1" stop-color="#090b15"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c3ff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab0ff"/><stop offset="0.5" stop-color="#b48bff"/><stop offset="1" stop-color="#5aa2ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232850"/><stop offset="1" stop-color="#0c0f1d"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c3ff"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a30" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0d1020" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
    <style>
      .ui { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      .l1 { animation: type 7s ease-out infinite; }
      .l2 { animation: type2 7s ease-out infinite; }
      .l3 { animation: type3 7s ease-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes type  { 0% { opacity: 0; } 6%, 92% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes type2 { 0%, 14% { opacity: 0; } 22%, 92% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes type3 { 0%, 30% { opacity: 0; } 38%, 92% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .float, .l1, .l2, .l3 { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glowL)"/>
    <rect width="1280" height="400" fill="url(#glowR)"/>

    <!-- logo -->
    <g transform="translate(88 92) scale(1.55)">
      <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#tile)"/>
      <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="14.75" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
      <g filter="url(#blur)" opacity="0.8">
        <path d="M18 21.5l11.5 10.5L18 42.5" fill="none" stroke="#9b7bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34 43h12" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
      </g>
      <path d="M18 21.5l11.5 10.5L18 42.5" fill="none" stroke="url(#chev)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="cursor" d="M34 43h12" stroke="#f7b84b" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <text x="88" y="250" class="ui" font-size="64" font-weight="700" fill="url(#title)" letter-spacing="-1.5">Pro Terminal</text>
    <text x="90" y="292" class="ui" font-size="22" fill="#aab1cc">A modern workspace for the real CMD and PowerShell.</text>

    <g class="ui" font-size="15" font-weight="600">
      <rect x="90" y="318" width="96" height="32" rx="16" fill="#7c6cff" fill-opacity="0.16" stroke="#9b8cff" stroke-opacity="0.45"/>
      <text x="138" y="339" text-anchor="middle" fill="#cfc8ff">ConPTY</text>
      <rect x="196" y="318" width="104" height="32" rx="16" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="248" y="339" text-anchor="middle" fill="#bcd6ff">Sessions</text>
      <rect x="310" y="318" width="96" height="32" rx="16" fill="#22c55e" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.4"/>
      <text x="358" y="339" text-anchor="middle" fill="#bdf3cf">Archive</text>
      <rect x="416" y="318" width="104" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
      <text x="468" y="339" text-anchor="middle" fill="#fde2a6">Snippets</text>
    </g>

    <!-- terminal window mock -->
    <g class="float">
      <g filter="url(#shadow)">
        <rect x="690" y="62" width="520" height="276" rx="16" fill="url(#win)" stroke="#ffffff" stroke-opacity="0.09"/>
      </g>
      <rect x="690" y="62" width="520" height="40" rx="16" fill="#ffffff" fill-opacity="0.03"/>
      <g class="ui" font-size="13">
        <rect x="706" y="72" width="120" height="22" rx="7" fill="#7c6cff" fill-opacity="0.22"/>
        <circle cx="719" cy="83" r="4" fill="#4ade80"/>
        <text x="730" y="87.5" fill="#e4e1ff">PowerShell</text>
        <circle cx="849" cy="83" r="4" fill="#60a5fa"/>
        <text x="860" y="87.5" fill="#8d94b3">CMD</text>
        <circle cx="917" cy="83" r="4" fill="#fbbf24"/>
        <text x="928" y="87.5" fill="#8d94b3">api · main</text>
      </g>
      <g class="mono" font-size="15">
        <g class="l1">
          <rect x="710" y="126" width="3" height="18" rx="1.5" fill="#4ade80"/>
          <text x="724" y="140"><tspan fill="#7c8cff">PS</tspan><tspan fill="#8bd5ff"> C:\dev\api</tspan><tspan fill="#c9c3ff"> ❯ </tspan><tspan fill="#ffffff">git pull</tspan></text>
          <text x="724" y="164" fill="#8d94b3">Already up to date.</text>
        </g>
        <g class="l2">
          <rect x="710" y="182" width="3" height="18" rx="1.5" fill="#4ade80"/>
          <text x="724" y="196"><tspan fill="#7c8cff">PS</tspan><tspan fill="#8bd5ff"> C:\dev\api</tspan><tspan fill="#c9c3ff"> ❯ </tspan><tspan fill="#ffffff">npm test</tspan></text>
          <text x="724" y="220"><tspan fill="#4ade80">✓</tspan><tspan fill="#8d94b3"> 128 passed</tspan><tspan fill="#5b6280">  (2.4s)</tspan></text>
        </g>
        <g class="l3">
          <rect x="710" y="238" width="3" height="18" rx="1.5" fill="#f87171"/>
          <text x="724" y="252"><tspan fill="#7c8cff">PS</tspan><tspan fill="#8bd5ff"> C:\dev\api</tspan><tspan fill="#c9c3ff"> ❯ </tspan><tspan fill="#ffffff">deploy {{env:staging}}</tspan></text>
          <text x="724" y="276" fill="#fca5a5">exit 1 · archived with full output</text>
        </g>
        <text x="724" y="308"><tspan fill="#7c8cff">PS</tspan><tspan fill="#8bd5ff"> C:\dev\api</tspan><tspan fill="#c9c3ff"> ❯ </tspan></text>
        <rect class="cursor" x="866" y="295" width="2.5" height="17" rx="1" fill="#f7b84b"/>
      </g>
    </g>
  </g>
</svg>
