name: 🐞 Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PowerShell session
        2. …
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      multiple: true
      options: [CMD, Windows PowerShell, PowerShell 7, Not shell-specific]
  - type: input
    id: version
    attributes:
      label: Pro Terminal version
      description: Settings › About
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`.
      placeholder: Windows 11 24H2 (build 26100)
  - type: textarea
    id: report
    attributes:
      label: Start-up report
      description: Settings › About › Copy report. Paste it here if it's related.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
